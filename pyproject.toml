[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squeeze-alpaca-bot"
version = "1.0.0"
description = "Deterministic small-cap momentum paper trading bot (Alpaca paper only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py==0.42.2",
    # alpaca-py 0.42.2 imports pytz from alpaca.data but does not declare it.
    "pytz==2024.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.6"]

[project.scripts]
squeeze-bot = "squeeze_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["squeeze_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
